<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book-Recommender System</title>
    <!--Latest compiled and minified CSS-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg320mUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
</head>
<style>
    .text-white{
        color:white
    }
    </style>
<body style="background-color:black">

    <nav class="navbar navbar-expand-lg" style="background-color:#00a65a">
        <a class="navbar-brand text-white" href="#">My Book Recommender</a>
     <ul class="nav navbar-nav">
        <li class="nav-item"><a class="nav-link text-white" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/recommend">Recommend</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="#">Contact</a></li>
        </ul>
        </nav>

        <div class="container">
            <div class="row">
            <div class="col-md-12">
                <h1 class="text-white" style="font-size:38px">Recommend Books</h1>
                <form action="/recommend_books" method="post">
                    <input name="user_input" type="text" class="form-control"><br>
                    <input type="submit" class="btn btn-lg btn-warning">
                    </form>


                </div>

                {% if data %}

                {% for i in data %}
                 <div class="col-md-3" style="margin-top:30px">
                    <div class="card">
                        <div class="card-body">
                            
                            <img class="card-img-top" src="{{ i[2] }}">
                            <div class="card-body">
                            <p class="text-white">{{i[0]}}</p>
                            <h5 class="text-white">{{i[1]}}</h5>

                </div>
                </div>
                </div>

                {% endfor %}
                
                {% endif %}

                
                </div>
            

               
                      
                </div>
                </div>
</body>
</html>
